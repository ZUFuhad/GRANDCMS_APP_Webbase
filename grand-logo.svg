<svg viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C450" />
      <stop offset="35%" stop-color="#D4991A" />
      <stop offset="70%" stop-color="#B37C0B" />
      <stop offset="100%" stop-color="#8F6004" />
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#B87D0C" />
      <stop offset="40%" stop-color="#E5AA28" />
      <stop offset="80%" stop-color="#FCD568" />
      <stop offset="100%" stop-color="#FFE899" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Crown directly on top of G -->
  <g transform="translate(18, 12)" filter="url(#subtleGlow)">
    <!-- Base band double arch -->
    <path d="M 22 45 C 44 41, 64 41, 86 45 C 64 43, 44 43, 22 45 Z" fill="url(#crownGrad)" stroke="#B87D0C" stroke-width="0.6"/>
    <path d="M 23 48 C 44 44, 65 44, 85 48 C 65 46, 44 46, 23 48 Z" fill="url(#crownGrad)" />
    
    <!-- Crown Spikes Body with 5 main points -->
    <path d="M 22 44 
             C 21 34, 22 25, 25 15
             L 30 20
             L 35 11
             L 42 24
             L 54 3
             L 66 24
             L 73 11
             L 78 20
             L 83 15
             C 86 25, 87 34, 86 44
             C 68 40, 40 40, 22 44 Z" fill="url(#crownGrad)" stroke="#B87D0C" stroke-width="0.6"/>
    
    <!-- Center Diamond (Tallest) -->
    <polygon points="54, -2 58.5, 3 54, 8 49.5, 3" fill="#FFE899" stroke="#B87D0C" stroke-width="0.5" />
    <!-- Intermediate Diamonds -->
    <polygon points="35, 6 38.5, 11 35, 15 31.5, 11" fill="#FFE899" stroke="#B87D0C" stroke-width="0.5" />
    <polygon points="73, 6 76.5, 11 73, 15 69.5, 11" fill="#FFE899" stroke="#B87D0C" stroke-width="0.5" />
    <!-- Outer Diamonds -->
    <polygon points="25, 10 28.5, 15 25, 19 21.5, 15" fill="#FFE899" stroke="#B87D0C" stroke-width="0.5" />
    <polygon points="83, 10 86.5, 15 83, 19 79.5, 15" fill="#FFE899" stroke="#B87D0C" stroke-width="0.5" />
    <!-- Inner small pearls -->
    <circle cx="30" cy="20" r="1.8" fill="#FFE899" stroke="#B87D0C" stroke-width="0.4" />
    <circle cx="78" cy="20" r="1.8" fill="#FFE899" stroke="#B87D0C" stroke-width="0.4" />
    <!-- Base corner pearls -->
    <circle cx="21" cy="45" r="2.4" fill="#FFE899" stroke="#B87D0C" stroke-width="0.5" />
    <circle cx="87" cy="45" r="2.4" fill="#FFE899" stroke="#B87D0C" stroke-width="0.5" />
  </g>

  <!-- Letter G and internal 3 rising growth bars -->
  <g transform="translate(18, 56)" filter="url(#subtleGlow)">
    <!-- Roman serif G -->
    <path d="M 88 18 
             C 80 10, 68 6, 54 6
             C 24 6, 2 28, 2 64
             C 2 100, 24 122, 54 122
             C 74 122, 88 112, 98 94
             C 102 86, 104 76, 104 68
             L 54 68
             L 54 80
             L 88 80
             C 86 96, 74 108, 54 108
             C 32 108, 18 90, 18 64
             C 18 38, 32 20, 54 20
             C 66 20, 76 26, 82 34
             L 94 22
             C 92 20, 90 19, 88 18 Z" fill="url(#goldGrad)" />
    <!-- Spur / right crossbar of G -->
    <path d="M 94 68 L 108 68 L 108 92 L 94 92 Z" fill="url(#goldGrad)" />
    <!-- 3 Rising growth bars inside G -->
    <rect x="34" y="68" width="10" height="34" rx="2" fill="url(#crownGrad)" stroke="#B87D0C" stroke-width="0.5" />
    <rect x="48" y="48" width="10" height="54" rx="2" fill="url(#crownGrad)" stroke="#B87D0C" stroke-width="0.5" />
    <rect x="62" y="30" width="10" height="72" rx="2" fill="url(#crownGrad)" stroke="#B87D0C" stroke-width="0.5" />
  </g>

  <!-- Wordmark RAND with distinct Swash R -->
  <g transform="translate(132, 56)" filter="url(#subtleGlow)">
    <!-- Letter R with swash leg -->
    <g transform="translate(0, 0)">
      <!-- R vertical stem -->
      <path d="M 4 8 L 22 8 L 22 120 L 4 120 L 4 112 L 12 112 L 12 16 L 4 16 Z" fill="url(#goldGrad)" />
      <!-- R top bowl -->
      <path d="M 12 8 L 48 8 C 68 8, 78 18, 78 34 C 78 50, 68 60, 48 60 L 12 60 Z M 22 16 L 22 52 L 46 52 C 58 52, 66 46, 66 34 C 66 22, 58 16, 46 16 Z" fill="url(#goldGrad)" />
      <!-- R swash curved leg ending in curl -->
      <path d="M 40 56 C 46 56, 50 62, 54 70 L 66 96 C 70 106, 76 116, 86 118 C 90 119, 96 119, 100 116 L 98 122 C 92 124, 84 124, 78 120 C 68 114, 60 100, 56 90 L 46 70 C 42 62, 36 58, 28 58 L 22 58 L 22 68 L 12 68 L 12 56 Z" fill="url(#goldGrad)" />
    </g>

    <!-- Letter A -->
    <g transform="translate(94, 0)">
      <path d="M 44 8 L 52 8 L 86 112 L 94 112 L 94 120 L 70 120 L 70 112 L 78 112 L 68 80 L 26 80 L 16 112 L 24 112 L 24 120 L 0 120 L 0 112 L 8 112 L 42 8 Z M 48 24 L 28 72 L 66 72 Z" fill="url(#goldGrad)" />
    </g>

    <!-- Letter N -->
    <g transform="translate(190, 0)">
      <path d="M 4 8 L 22 8 L 22 112 L 30 112 L 30 120 L 4 120 L 4 112 L 12 112 L 12 16 L 4 16 Z" fill="url(#goldGrad)" />
      <path d="M 12 8 L 24 8 L 76 110 L 76 16 L 68 16 L 68 8 L 88 8 L 88 16 L 80 16 L 80 120 L 68 120 L 14 16 L 14 8 Z" fill="url(#goldGrad)" />
    </g>

    <!-- Letter D -->
    <g transform="translate(282, 0)">
      <path d="M 4 8 L 38 8 C 66 8, 86 28, 86 64 C 86 100, 66 120, 38 120 L 4 120 L 4 112 L 12 112 L 12 16 L 4 16 Z M 22 16 L 22 112 L 36 112 C 58 112, 74 96, 74 64 C 74 32, 58 16, 36 16 Z" fill="url(#goldGrad)" />
    </g>
  </g>

  <!-- Tagline: we value what you have to say! -->
  <text x="200" y="200" text-anchor="middle" font-family="'Dancing Script', cursive" font-size="26" font-weight="700" fill="#D4991A" letter-spacing="0.5">we value what you have to say!</text>

  <!-- Established Line -->
  <line x1="26" y1="222" x2="140" y2="222" stroke="#D4991A" stroke-width="1.2" opacity="0.8" />
  <text x="200" y="226" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="800" letter-spacing="5" fill="#D4991A">EST. 2004</text>
  <line x1="260" y1="222" x2="374" y2="222" stroke="#D4991A" stroke-width="1.2" opacity="0.8" />
</svg>
