<svg viewBox="0 0 320 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grandGoldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DF9F1A" />
      <stop offset="50%" stop-color="#C88E13" />
      <stop offset="100%" stop-color="#A87309" />
    </linearGradient>
    <linearGradient id="grandCrownGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C88E13" />
      <stop offset="60%" stop-color="#E5AB2C" />
      <stop offset="100%" stop-color="#F9D46A" />
    </linearGradient>
  </defs>

  <!-- Crown -->
  <g transform="translate(18, 2)">
    <path d="M20 38 C 22 28, 26 20, 28 14 L 32 17 L 38 7 L 44 19 L 52 1 L 60 19 L 66 7 L 72 17 L 76 14 C 78 20, 82 28, 84 38 C 70 34, 34 34, 20 38 Z" fill="url(#grandCrownGradient)" />
    <polygon points="52,-2 55,2 52,6 49,2" fill="#C88E13" />
    <polygon points="38,4 40.5,7 38,10 35.5,7" fill="#C88E13" />
    <polygon points="66,4 68.5,7 66,10 63.5,7" fill="#C88E13" />
    <circle cx="28" cy="13" r="2.2" fill="#C88E13" />
    <circle cx="76" cy="13" r="2.2" fill="#C88E13" />
    <path d="M 23 37 Q 52 32 81 37 Q 52 35 23 37" stroke="#DDA01D" stroke-width="1.5" fill="none" />
  </g>

  <!-- Majestic G with internal growth bars -->
  <g transform="translate(14, 42)">
    <path d="M 68 12 C 55 5, 36 6, 22 17 C 8 28, 0 46, 0 68 C 0 92, 10 110, 26 122 C 40 132, 60 134, 76 126 C 92 118, 102 102, 104 84 L 84 84 C 82 95, 75 106, 64 111 C 52 117, 36 114, 26 104 C 16 93, 11 78, 11 63 C 11 47, 18 33, 29 25 C 38 18, 51 17, 62 21 C 67 23, 72 26, 75 30 L 85 18 C 80 14, 74 12, 68 12 Z" fill="url(#grandGoldGradient)" />
    <path d="M 60 76 L 105 76 L 105 92 L 60 92 Z" fill="url(#grandGoldGradient)" />
    <rect x="36" y="72" width="10" height="36" rx="1.5" fill="url(#grandCrownGradient)" />
    <rect x="50" y="52" width="10" height="56" rx="1.5" fill="url(#grandCrownGradient)" />
    <rect x="64" y="36" width="10" height="72" rx="1.5" fill="url(#grandCrownGradient)" />
  </g>

  <!-- 'RAND' Serif Typography -->
  <g transform="translate(108, 52)">
    <text x="0" y="85" font-family="'Cinzel', Georgia, serif" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#grandGoldGradient)">R</text>
    <text x="62" y="85" font-family="'Cinzel', Georgia, serif" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#grandGoldGradient)">A</text>
    <text x="126" y="85" font-family="'Cinzel', Georgia, serif" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#grandGoldGradient)">N</text>
    <text x="188" y="85" font-family="'Cinzel', Georgia, serif" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#grandGoldGradient)">D</text>
  </g>

  <!-- Tagline and EST 2004 -->
  <text x="160" y="156" text-anchor="middle" font-family="'Dancing Script', cursive" font-size="21" font-weight="700" fill="#C88E13" letter-spacing="0.8">we value what you have to say!</text>
  <line x1="18" y1="172" x2="110" y2="172" stroke="#C88E13" stroke-width="0.8" opacity="0.6" />
  <text x="160" y="175" text-anchor="middle" font-family="'Cinzel', sans-serif" font-size="12.5" font-weight="700" letter-spacing="5" fill="#C88E13">EST. 2004</text>
  <line x1="210" y1="172" x2="302" y2="172" stroke="#C88E13" stroke-width="0.8" opacity="0.6" />
</svg>
